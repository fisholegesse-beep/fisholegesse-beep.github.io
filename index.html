<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPL Ultimate Penalty Shootout Stadium</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --epl-purple: #38003c;
            --epl-green: #00ff87;
            --epl-pink: #ff005a;
            --epl-blue: #04f5ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #05010a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            width: 1050px;
            height: 680px;
            background: #000;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(0, 255, 135, 0.3);
            position: relative;
            overflow: hidden;
            border: 3px solid var(--epl-green);
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        h1.title {
            font-size: 32px;
            font-weight: 900;
            text-transform: uppercase;
            background: linear-gradient(45deg, var(--epl-green), var(--epl-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        /* AUTH & BETTING */
        .auth-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid var(--epl-green);
            border-radius: 15px;
            padding: 25px;
            width: 380px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            border: 1px solid var(--epl-green);
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            font-weight: bold;
            font-size: 15px;
            outline: none;
        }

        .balance-bar {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            padding: 10px 25px;
            border-radius: 10px;
            color: #000;
            font-weight: 900;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .team-select-wrapper {
            display: flex;
            justify-content: space-between;
            width: 100%;
            gap: 15px;
            margin-bottom: 15px;
        }

        .player-box {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 10px;
            width: 50%;
            text-align: center;
        }

        .team-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            max-height: 180px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .team-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 6px 2px;
            cursor: pointer;
            font-size: 10px;
            font-weight: bold;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .team-card.selected {
            background: var(--epl-green);
            color: #000;
        }

        .btn-action {
            background: linear-gradient(45deg, var(--epl-green), #00c853);
            color: #0b0210;
            font-size: 18px;
            font-weight: 900;
            padding: 12px 35px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0, 255, 135, 0.4);
            text-transform: uppercase;
        }

        .btn-action:hover { transform: scale(1.05); }

        /* HEADER SCOREBOARD & SHOT INDICATORS */
        .hud-header {
            width: 100%;
            height: 90px;
            background: rgba(15, 0, 25, 0.95);
            border-bottom: 2px solid var(--epl-green);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 20;
        }

        .team-hud-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 250px;
        }

        .hud-team-name {
            font-weight: 900;
            font-size: 18px;
            margin-bottom: 5px;
        }

        .shots-tracker {
            display: flex;
            gap: 6px;
        }

        .shot-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
        }
        .shot-dot.goal { background: var(--epl-green); color: #000; }
        .shot-dot.miss { background: var(--epl-pink); color: #fff; }

        .hud-score-box {
            background: var(--epl-purple);
            border: 2px solid var(--epl-green);
            border-radius: 12px;
            padding: 5px 25px;
            text-align: center;
        }

        /* INTERNATIONAL STADIUM DESIGN WITH CROWD */
        .stadium-stage {
            width: 100%;
            height: 510px;
            position: relative;
            background: #111;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        /* Stadium Stands & Crowd Animation */
        .stadium-stands {
            position: absolute;
            top: 0;
            width: 100%;
            height: 230px;
            background: repeating-linear-gradient(
                0deg,
                #1a0520,
                #1a0520 15px,
                #2a0a30 15px,
                #2a0a30 30px
            );
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            overflow: hidden;
            border-bottom: 5px solid #222;
        }

        .crowd-layer {
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 10px 10px, #ff005a 2px, transparent 3px),
                radial-gradient(circle at 25px 15px, #00ff87 2px, transparent 3px),
                radial-gradient(circle at 40px 8px, #04f5ff 2px, transparent 3px),
                radial-gradient(circle at 55px 18px, #ffffff 2px, transparent 3px);
            background-size: 60px 30px;
            animation: crowdCheer 0.8s infinite alternate ease-in-out;
            opacity: 0.8;
        }

        @keyframes crowdCheer {
            0% { transform: translateY(0); }
            100% { transform: translateY(-3px); }
        }

        /* Pitch / Pitch Lines */
        .pitch-grass {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 280px;
            background: repeating-linear-gradient(
                90deg,
                #1b5e20,
                #1b5e20 60px,
                #2e7d32 60px,
                #2e7d32 120px
            );
            border-top: 4px solid #fff;
        }

        .penalty-box-line {
            position: absolute;
            top: 0;
            left: 15%;
            width: 70%;
            height: 180px;
            border: 4px solid rgba(255, 255, 255, 0.7);
            border-top: none;
        }

        .penalty-spot {
            position: absolute;
            bottom: 45px;
            left: calc(50% - 4px);
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
        }

        /* Goal Post & Net */
        .goal-frame {
            position: absolute;
            top: 100px;
            width: 580px;
            height: 220px;
            border: 10px solid #ffffff;
            border-bottom: none;
            z-index: 5;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
            background: repeating-linear-gradient(45deg, rgba(255,255,255,0.15), rgba(255,255,255,0.15) 8px, rgba(0,0,0,0.1) 8px, rgba(0,0,0,0.1) 16px);
        }

        /* Goalkeeper */
        .goalkeeper {
            position: absolute;
            bottom: 245px;
            left: calc(50% - 25px);
            width: 50px;
            height: 95px;
            z-index: 6;
            transition: all 0.5s ease-out;
        }

        .keeper-body {
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #ff9100, #ff3d00);
            border-radius: 12px;
            border: 2px solid #000;
            position: relative;
        }
        .keeper-head {
            position: absolute;
            top: -18px;
            left: 12px;
            width: 24px;
            height: 24px;
            background: #ffcc80;
            border-radius: 50%;
            border: 2px solid #000;
        }

        /* Football */
        .ball {
            position: absolute;
            bottom: 35px;
            left: calc(50% - 18px);
            width: 36px;
            height: 36px;
            background: #fff;
            border-radius: 50%;
            z-index: 8;
            transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 8px 10px rgba(0,0,0,0.5);
        }
        .ball::before { content: '⚽'; font-size: 32px; position: absolute; top: -5px; left: 1px; }

        /* Target Shooting Grid */
        .target-grid {
            position: absolute;
            top: 110px;
            width: 560px;
            height: 200px;
            z-index: 9;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 10px;
        }

        .target-zone {
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.2s;
        }
        .target-zone:hover { background: rgba(0, 255, 135, 0.3); border-color: var(--epl-green); }

        .bottom-bar {
            width: 100%;
            height: 80px;
            background: rgba(10, 0, 18, 0.95);
            border-top: 2px solid var(--epl-green);
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 15px;
            z-index: 20;
        }
    </style>
</head>
<body>

    <div id="game-container">
        
        <!-- SCREEN 0: OTP LOGIN SCREEN -->
        <div id="auth-screen" class="screen">
            <h1 class="title">EPL STADIUM PENALTY</h1>
            <p style="margin-bottom: 20px; color: #d8b4fe;">ለመጫወት በስልክ ቁጥርዎ ይግቡ</p>
            <div class="auth-card">
                <input type="tel" id="user-phone" placeholder="የስልክ ቁጥር (09........)">
                <button class="btn-action" style="width:100%; font-size:15px;" onclick="sendOTP()">OTP ላክ</button>

                <div id="otp-group" style="display:none; margin-top:15px;">
                    <input type="number" id="otp-code" placeholder="4 አሃዝ OTP ያስገቡ">
                    <button class="btn-action" style="width:100%; font-size:15px; background:var(--epl-blue);" onclick="verifyOTP()">ተመዝገብ / ግባ</button>
                </div>
            </div>
        </div>

        <!-- SCREEN 1: BETTING & TEAM SELECTION -->
        <div id="select-screen" class="screen hidden">
            <div class="balance-bar">
                ሒሳብዎ: <span id="user-balance">500</span> ብር
            </div>

            <h1 class="title" style="font-size: 24px;">የብር መጠን እና ቡድን ይምረጡ</h1>

            <div style="width: 380px; margin-bottom: 15px;">
                <label style="font-size:13px; color:var(--epl-green);">የመወራረጃ የብር መጠን፦</label>
                <select id="bet-amount">
                    <option value="10">10 ብር (ለማሸነፍ: 15 ብር)</option>
                    <option value="20">20 ብር (ለማሸነፍ: 30 ብር)</option>
                    <option value="30">30 ብር (ለማሸነፍ: 45 ብር)</option>
                    <option value="50">50 ብር (ለማሸነፍ: 75 ብር)</option>
                    <option value="100">100 ብር (ለማሸነፍ: 150 ብር)</option>
                </select>
            </div>

            <div class="team-select-wrapper">
                <div class="player-box">
                    <div style="color:var(--epl-green); font-weight:bold; font-size:13px; margin-bottom:5px;">የእርስዎ ቡድን (መች)</div>
                    <div class="team-grid" id="p1-teams"></div>
                </div>
                <div class="player-box">
                    <div style="color:var(--epl-blue); font-weight:bold; font-size:13px; margin-bottom:5px;">የተጋጣሚ ቡድን</div>
                    <div class="team-grid" id="p2-teams"></div>
                </div>
            </div>

            <button class="btn-action" onclick="startMatch()">ስታዲየም ግባ <i class="fa-solid fa-stadium"></i></button>
        </div>

        <!-- SCREEN 2: GAMEPLAY STADIUM -->
        <div id="game-screen" class="screen hidden" style="padding:0; justify-content:flex-start;">
            <!-- Scoreboard HUD -->
            <div class="hud-header">
                <div class="team-hud-info">
                    <div id="p1-hud-name" class="hud-team-name" style="color:var(--epl-green);">ARS</div>
                    <div class="shots-tracker" id="p1-dots"></div>
                </div>
                <div class="hud-score-box">
                    <div id="score-text" style="font-size:26px; font-weight:900;">0 - 0</div>
                    <div id="turn-text" style="font-size:11px; color:var(--epl-green); font-weight:bold;">የእርስዎ ተራ (መታት)</div>
                </div>
                <div class="team-hud-info">
                    <div id="p2-hud-name" class="hud-team-name" style="color:var(--epl-blue);">MCI</div>
                    <div class="shots-tracker" id="p2-dots"></div>
                </div>
            </div>

            <!-- Stadium Visual -->
            <div class="stadium-stage">
                <div class="stadium-stands"><div class="crowd-layer"></div></div>
                <div class="pitch-grass">
                    <div class="penalty-box-line"></div>
                    <div class="penalty-spot"></div>
                </div>

                <div class="goal-frame"></div>

                <!-- Interactive Target Zones -->
                <div class="target-grid">
                    <div class="target-zone" onclick="playerTakeShot('tl')">🎯</div>
                    <div class="target-zone" onclick="playerTakeShot('tc')">🎯</div>
                    <div class="target-zone" onclick="playerTakeShot('tr')">🎯</div>
                    <div class="target-zone" onclick="playerTakeShot('bl')">🎯</div>
                    <div class="target-zone" onclick="playerTakeShot('bc')">🎯</div>
                    <div class="target-zone" onclick="playerTakeShot('br')">🎯</div>
                </div>

                <div class="goalkeeper" id="goalkeeper">
                    <div class="keeper-head"></div>
                    <div class="keeper-body"></div>
                </div>
                <div class="ball" id="football"></div>
            </div>

            <!-- Commentary Bar -->
            <div class="bottom-bar">
                <i class="fa-solid fa-bullhorn" style="color:var(--epl-pink); font-size:24px;"></i>
                <div id="commentary-text" style="font-weight:600; font-size:15px;">ኮሜንታተር፦ አቅጣጫ መርጠው ኳሷን ይመቱ!</div>
            </div>
        </div>

        <!-- SCREEN 3: WINNER OVERLAY -->
        <div id="winner-screen" class="screen hidden" style="background:rgba(0,0,0,0.95);">
            <i class="fa-solid fa-trophy" style="font-size:65px; color:#ffd700; margin-bottom:15px;"></i>
            <h1 id="winner-title" style="color:var(--epl-green); margin-bottom:10px;">ARSENAL WINS!</h1>
            <p id="winner-score" style="font-size:18px; margin-bottom:15px;"></p>
            <p id="winner-prize" style="font-size:22px; color:#ffd700; font-weight:bold; margin-bottom:20px;"></p>
            <button class="btn-action" onclick="resetToSelection()">ድጋሚ ጫወት</button>
        </div>

    </div>

    <script>
        let balance = 500;
        let currentBet = 10;
        
        // 20 ALL EPL TEAMS
        const eplTeams = [
            { id: 'ARS', name: 'Arsenal' }, { id: 'MCI', name: 'Man City' },
            { id: 'LIV', name: 'Liverpool' }, { id: 'MUN', name: 'Man United' },
            { id: 'CHE', name: 'Chelsea' }, { id: 'TOT', name: 'Tottenham' },
            { id: 'NEW', name: 'Newcastle' }, { id: 'AVL', name: 'Aston Villa' },
            { id: 'BHA', name: 'Brighton' }, { id: 'WHU', name: 'West Ham' },
            { id: 'FUL', name: 'Fulham' }, { id: 'BOU', name: 'Bournemouth' },
            { id: 'CRY', name: 'Crystal Palace' }, { id: 'WOL', name: 'Wolves' },
            { id: 'EVE', name: 'Everton' }, { id: 'BRE', name: 'Brentford' },
            { id: 'NOT', name: 'Nottm Forest' }, { id: 'LEI', name: 'Leicester' },
            { id: 'SOU', name: 'Southampton' }, { id: 'IPS', name: 'Ipswich Town' }
        ];

        let selectedP1 = eplTeams[0];
        let selectedP2 = eplTeams[1];

        let p1Shots = []; // Array of boolean (true = Goal, false = Miss)
        let p2Shots = [];
        let p1Score = 0;
        let p2Score = 0;
        let currentTurn = 1; // 1 = P1 Shoot, 2 = P2 Shoot
        let isShooting = false;

        // TARGET POSITIONS (px coordinates)
        const targetCoords = {
            'tl': { left: '260px', bottom: '310px' },
            'tc': { left: '480px', bottom: '310px' },
            'tr': { left: '700px', bottom: '310px' },
            'bl': { left: '260px', bottom: '240px' },
            'bc': { left: '480px', bottom: '240px' },
            'br': { left: '700px', bottom: '240px' }
        };

        const keeperJumpCoords = {
            'tl': 'translateX(-180px) translateY(-60px) rotate(-45deg)',
            'tc': 'translateY(-60px)',
            'tr': 'translateX(180px) translateY(-60px) rotate(45deg)',
            'bl': 'translateX(-180px) rotate(-30deg)',
            'bc': 'none',
            'br': 'translateX(180px) rotate(30deg)'
        };

        // AUDIO SYNTHESIS FOR COMMENTARY
        function speakCommentary(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const msg = new SpeechSynthesisUtterance(text);
                msg.rate = 1.0;
                window.speechSynthesis.speak(msg);
            }
        }

        // AUTH
        function sendOTP() {
            const phone = document.getElementById('user-phone').value;
            if (phone.length >= 10) {
                alert(`OTP ቁጥር በ SMS ወደ ${phone} ተልኳል! (ለሙከራ: 1234)`);
                document.getElementById('otp-group').style.display = 'block';
            } else {
                alert('እባክዎን ትክክለኛ የስልክ ቁጥር ያስገቡ!');
            }
        }

        function verifyOTP() {
            const otp = document.getElementById('otp-code').value;
            if (otp === "1234") {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('select-screen').classList.remove('hidden');
                updateBalanceUI();
            } else {
                alert('የተሳሳተ OTP ቁጥር!');
            }
        }

        function updateBalanceUI() {
            document.getElementById('user-balance').innerText = balance;
        }

        // RENDER TEAMS
        function renderTeams() {
            const p1Grid = document.getElementById('p1-teams');
            const p2Grid = document.getElementById('p2-teams');
            p1Grid.innerHTML = ''; p2Grid.innerHTML = '';

            eplTeams.forEach(t => {
                const c1 = document.createElement('div');
                c1.className = `team-card ${t.id === selectedP1.id ? 'selected' : ''}`;
                c1.innerText = t.name;
                c1.onclick = () => { selectedP1 = t; renderTeams(); };
                p1Grid.appendChild(c1);

                const c2 = document.createElement('div');
                c2.className = `team-card ${t.id === selectedP2.id ? 'selected' : ''}`;
                c2.innerText = t.name;
                c2.onclick = () => { selectedP2 = t; renderTeams(); };
                p2Grid.appendChild(c2);
            });
        }
        renderTeams();

        function startMatch() {
            currentBet = parseFloat(document.getElementById('bet-amount').value);
            if (balance < currentBet) {
                alert('በቂ ባላንስ የሎትም!');
                return;
            }

            balance -= currentBet;
            updateBalanceUI();

            document.getElementById('select-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');

            document.getElementById('p1-hud-name').innerText = selectedP1.name;
            document.getElementById('p2-hud-name').innerText = selectedP2.name;
            
            p1Score = 0; p2Score = 0;
            p1Shots = []; p2Shots = [];
            currentTurn = 1;
            
            renderShotsTracker();
            updateHUD();
            speakCommentary("ጨዋታው ተጀምሯል! የመጀመሪያውን ፔናሊቲ ይምቱ።");
        }

        function renderShotsTracker() {
            const p1Dots = document.getElementById('p1-dots');
            const p2Dots = document.getElementById('p2-dots');
            p1Dots.innerHTML = ''; p2Dots.innerHTML = '';

            for (let i = 0; i < 5; i++) {
                const d1 = document.createElement('div');
                d1.className = `shot-dot ${p1Shots[i] === true ? 'goal' : p1Shots[i] === false ? 'miss' : ''}`;
                d1.innerText = p1Shots[i] === true ? '✓' : p1Shots[i] === false ? '✕' : '';
                p1Dots.appendChild(d1);

                const d2 = document.createElement('div');
                d2.className = `shot-dot ${p2Shots[i] === true ? 'goal' : p2Shots[i] === false ? 'miss' : ''}`;
                d2.innerText = p2Shots[i] === true ? '✓' : p2Shots[i] === false ? '✕' : '';
                p2Dots.appendChild(d2);
            }
        }

        function updateHUD() {
            document.getElementById('score-text').innerText = `${p1Score} - ${p2Score}`;
            if (currentTurn === 1) {
                document.getElementById('turn-text').innerText = "የእርስዎ ተራ (መታት)";
                document.getElementById('turn-text').style.color = "var(--epl-green)";
            } else {
                document.getElementById('turn-text').innerText = "የተጋጣሚ ተራ (ተከላከል)";
                document.getElementById('turn-text').style.color = "var(--epl-blue)";
            }
        }

        function playerTakeShot(targetZone) {
            if (isShooting || currentTurn !== 1) return;
            executeShot(targetZone, true);
        }

        function executeShot(targetZone, isP1) {
            isShooting = true;
            const ball = document.getElementById('football');
            const keeper = document.getElementById('goalkeeper');

            // Ball moves to target
            const pos = targetCoords[targetZone];
            ball.style.left = pos.left;
            ball.style.bottom = pos.bottom;
            ball.style.transform = 'scale(0.4)';

            // AI Keeper Reaction
            const zones = ['tl', 'tc', 'tr', 'bl', 'bc', 'br'];
            const keeperChoice = zones[Math.floor(Math.random() * zones.length)];
            keeper.style.transform = keeperJumpCoords[keeperChoice];

            const isSaved = keeperChoice === targetZone;

            setTimeout(() => {
                let commentary = "";
                if (!isSaved) {
                    commentary = "ጎኦኦኦል! ድንቅ አገባብ!";
                    if (isP1) { p1Score++; p1Shots.push(true); } 
                    else { p2Score++; p2Shots.push(true); }
                } else {
                    commentary = "ተመለሰ! የበረኛው ድንቅ አድኖ!";
                    if (isP1) { p1Shots.push(false); } 
                    else { p2Shots.push(false); }
                }

                document.getElementById('commentary-text').innerText = `ኮሜንታተር፦ ${commentary}`;
                speakCommentary(commentary);

                renderShotsTracker();
                updateHUD();

                // Reset Ball & Keeper Position
                setTimeout(() => {
                    ball.style.left = 'calc(50% - 18px)';
                    ball.style.bottom = '35px';
                    ball.style.transform = 'scale(1)';
                    keeper.style.transform = 'none';

                    // Check End Match (5 shots each)
                    if (p1Shots.length >= 5 && p2Shots.length >= 5) {
                        endGame();
                    } else {
                        // Switch Turn
                        currentTurn = isP1 ? 2 : 1;
                        updateHUD();
                        isShooting = false;

                        // AI Automated Shot if Turn 2
                        if (currentTurn === 2) {
                            setTimeout(() => {
                                const randomTarget = zones[Math.floor(Math.random() * zones.length)];
                                executeShot(randomTarget, false);
                            }, 1500);
                        }
                    }
                }, 1200);

            }, 600);
        }

        function endGame() {
            document.getElementById('winner-screen').classList.remove('hidden');
            const winnerText = document.getElementById('winner-title');
            const scoreText = document.getElementById('winner-score');
            const prizeText = document.getElementById('winner-prize');

            scoreText.innerText = `ውጤት: ${selectedP1.name} ${p1Score} - ${p2Score} ${selectedP2.name}`;

            if (p1Score > p2Score) {
                const winAmt = currentBet * 1.5;
                balance += winAmt;
                winnerText.innerText = `እንኳን ደስ አለዎት! ${selectedP1.name} አሸነፈ!`;
                prizeText.innerText = `የተሸለሙት የብር መጠን: +${winAmt} ብር`;
                speakCommentary(`እንኳን ደስ አለዎት! ${selectedP1.name} አሸንፏል።`);
            } else if (p2Score > p1Score) {
                winnerText.innerText = `${selectedP2.name} አሸነፈ!`;
                prizeText.innerText = `የተጫወቱት ${currentBet} ብር ተበልቷል።`;
                speakCommentary(`ተሸንፈዋል። ${selectedP2.name} አሸንፏል።`);
            } else {
                balance += currentBet; // Draw refund
                winnerText.innerText = "አኩል ወጡ!";
                prizeText.innerText = `የተጫወቱት ${currentBet} ብር ተመልሶልዎታል።`;
                speakCommentary("አኩል ተለያይታችኋል።");
            }
            updateBalanceUI();
        }

        function resetToSelection() {
            isShooting = false;
            document.getElementById('winner-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('select-screen').classList.remove('hidden');
        }
    </script>
</body>
</html>
