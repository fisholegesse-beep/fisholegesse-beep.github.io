<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPL Ultimate Penalty Shootout - ፕሪምየር ሊግ ፔናሊቲ</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --epl-purple: #38003c;
            --epl-green: #00ff87;
            --epl-pink: #ff005a;
            --epl-blue: #04f5ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0b0210;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            width: 1000px;
            height: 650px;
            background: linear-gradient(135deg, #18001e, #38003c);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 255, 135, 0.2), 0 0 30px rgba(0, 0, 0, 0.8);
            position: relative;
            overflow: hidden;
            border: 3px solid var(--epl-green);
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: opacity 0.4s ease;
            z-index: 10;
        }

        .hidden {
            display: none !important;
            opacity: 0;
            pointer-events: none;
        }

        h1.title {
            font-size: 34px;
            font-weight: 900;
            text-transform: uppercase;
            background: linear-gradient(45deg, var(--epl-green), var(--epl-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        /* AUTH & BETTING STYLES */
        .auth-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid var(--epl-green);
            border-radius: 15px;
            padding: 25px;
            width: 380px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            border: 1px solid var(--epl-green);
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            font-weight: bold;
            font-size: 15px;
            outline: none;
        }

        .balance-bar {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            padding: 10px 20px;
            border-radius: 10px;
            color: #000;
            font-weight: 900;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .team-select-wrapper {
            display: flex;
            justify-content: space-around;
            width: 100%;
            margin-bottom: 15px;
        }

        .player-box {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 10px;
            width: 46%;
            text-align: center;
        }

        .team-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-height: 160px;
            overflow-y: auto;
        }

        .team-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 8px 4px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
        }

        .team-card.selected {
            background: var(--epl-green);
            color: #000;
            font-weight: bold;
        }

        .btn-action {
            background: linear-gradient(45deg, var(--epl-green), #00c853);
            color: #0b0210;
            font-size: 18px;
            font-weight: 900;
            padding: 12px 35px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0, 255, 135, 0.4);
            text-transform: uppercase;
        }

        .btn-action:hover { transform: scale(1.05); }

        /* HUD & STADIUM */
        .hud-header {
            width: 100%;
            height: 80px;
            background: rgba(15, 0, 25, 0.95);
            border-bottom: 2px solid var(--epl-green);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 20;
        }

        .hud-score-box {
            background: var(--epl-purple);
            border: 2px solid var(--epl-green);
            border-radius: 10px;
            padding: 5px 20px;
            text-align: center;
        }

        .stadium-stage {
            width: 100%;
            height: 490px;
            position: relative;
            background: radial-gradient(circle at 50% 30%, #2e7d32, #1b5e20 70%, #0d3b10);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .goal-frame {
            position: absolute;
            top: 60px;
            width: 540px;
            height: 210px;
            border: 10px solid #ffffff;
            border-bottom: none;
            z-index: 5;
            background: repeating-linear-gradient(45deg, rgba(255,255,255,0.1), rgba(255,255,255,0.1) 5px, rgba(0,0,0,0.1) 5px, rgba(0,0,0,0.1) 10px);
        }

        .goalkeeper {
            position: absolute;
            bottom: 10px;
            left: calc(50% - 30px);
            width: 60px;
            height: 100px;
            z-index: 6;
            transition: all 0.5s ease;
        }

        .keeper-body {
            width: 100%;
            height: 100%;
            background: #ff6d00;
            border-radius: 10px;
            border: 2px solid #000;
        }

        .ball {
            position: absolute;
            bottom: 40px;
            left: calc(50% - 18px);
            width: 36px;
            height: 36px;
            background: #fff;
            border-radius: 50%;
            z-index: 8;
            transition: all 0.6s cubic-bezier(0.1, 0.8, 0.3, 1);
        }
        .ball::before { content: '⚽'; font-size: 30px; position: absolute; top: -3px; left: 1px; }

        .target-grid {
            position: absolute;
            top: 70px;
            width: 520px;
            height: 190px;
            z-index: 9;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 10px;
        }

        .target-zone {
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .target-zone:hover { background: rgba(0, 255, 135, 0.3); }

        .bottom-bar {
            width: 100%;
            height: 80px;
            background: rgba(10, 0, 18, 0.95);
            border-top: 2px solid var(--epl-green);
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 15px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        
        <!-- SCREEN 0: OTP LOGIN SCREEN -->
        <div id="auth-screen" class="screen">
            <h1 class="title">EPL PENALTY BET</h1>
            <p style="margin-bottom: 20px; color: #d8b4fe;">ለመጫወት በስልክ ቁጥርዎ ይግቡ</p>
            <div class="auth-card">
                <input type="tel" id="user-phone" placeholder="የስልክ ቁጥር (09........)">
                <button class="btn-action" style="width:100%; font-size:15px;" onclick="sendOTP()">OTP ላክ</button>

                <div id="otp-group" style="display:none; margin-top:15px;">
                    <input type="number" id="otp-code" placeholder="4 አሃዝ OTP ያስገቡ">
                    <button class="btn-action" style="width:100%; font-size:15px; background:var(--epl-blue);" onclick="verifyOTP()">ተመዝገብ / ግባ</button>
                </div>
            </div>
        </div>

        <!-- SCREEN 1: BETTING & TEAM SELECTION -->
        <div id="select-screen" class="screen hidden">
            <div class="balance-bar">
                ሒሳብዎ: <span id="user-balance">500</span> ብር
            </div>

            <h1 class="title" style="font-size: 26px;">የብር መጠን እና ቡድን ይምረጡ</h1>

            <div style="width: 380px; margin-bottom: 15px;">
                <label style="font-size:13px; color:var(--epl-green);">የመወራረጃ የብር መጠን፦</label>
                <select id="bet-amount">
                    <option value="10">10 ብር (ለማሸነፍ: 15 ብር)</option>
                    <option value="20">20 ብር (ለማሸነፍ: 30 ብር)</option>
                    <option value="30">30 ብር (ለማሸነፍ: 45 ብር)</option>
                    <option value="40">40 ብር (ለማሸነፍ: 60 ብር)</option>
                    <option value="50">50 ብር (ለማሸነፍ: 75 ብር)</option>
                    <option value="60">60 ብር (ለማሸነፍ: 90 ብር)</option>
                    <option value="70">70 ብር (ለማሸነፍ: 105 ብር)</option>
                    <option value="80">80 ብር (ለማሸነፍ: 120 ብር)</option>
                    <option value="90">90 ብር (ለማሸነፍ: 135 ብር)</option>
                    <option value="100">100 ብር (ለማሸነፍ: 150 ብር)</option>
                </select>
            </div>

            <div class="team-select-wrapper">
                <div class="player-box">
                    <div style="color:var(--epl-green); font-weight:bold; font-size:14px;">ተጫዋች 1 (እርስዎ)</div>
                    <div class="team-grid" id="p1-teams"></div>
                </div>
                <div class="player-box">
                    <div style="color:var(--epl-blue); font-weight:bold; font-size:14px;">ተጫዋች 2 (ተጋጣሚ)</div>
                    <div class="team-grid" id="p2-teams"></div>
                </div>
            </div>

            <button class="btn-action" onclick="startMatch()">ጨዋታውን ጀምር <i class="fa-solid fa-play"></i></button>
        </div>

        <!-- SCREEN 2: GAMEPLAY -->
        <div id="game-screen" class="screen hidden" style="padding:0; justify-content:flex-start;">
            <div class="hud-header">
                <div>
                    <span id="p1-hud-name" style="font-weight:bold; color:var(--epl-green);">ARS</span>
                    <div id="p1-dots"></div>
                </div>
                <div class="hud-score-box">
                    <div id="score-text" style="font-size:24px; font-weight:900;">0 - 0</div>
                    <div id="round-text" style="font-size:10px; color:var(--epl-green);">ዙር 1 / 6</div>
                </div>
                <div>
                    <span id="p2-hud-name" style="font-weight:bold; color:var(--epl-blue);">MCI</span>
                    <div id="p2-dots"></div>
                </div>
            </div>

            <div class="stadium-stage">
                <div class="goal-frame"></div>

                <div class="target-grid">
                    <div class="target-zone" onclick="takeShot('top-left')">🎯</div>
                    <div class="target-zone" onclick="takeShot('top-center')">🎯</div>
                    <div class="target-zone" onclick="takeShot('top-right')">🎯</div>
                    <div class="target-zone" onclick="takeShot('bottom-left')">🎯</div>
                    <div class="target-zone" onclick="takeShot('bottom-center')">🎯</div>
                    <div class="target-zone" onclick="takeShot('bottom-right')">🎯</div>
                </div>

                <div class="goalkeeper" id="goalkeeper"><div class="keeper-body"></div></div>
                <div class="ball" id="football"></div>
            </div>

            <div class="bottom-bar">
                <i class="fa-solid fa-microphone" style="color:var(--epl-pink); font-size:20px;"></i>
                <div id="commentary-text" style="font-weight:600;">ኮሜንታተር፦ አቅጣጫ መርጠው ይመቱ!</div>
            </div>
        </div>

        <!-- SCREEN 3: WINNER OVERLAY -->
        <div id="winner-screen" class="screen hidden" style="background:rgba(0,0,0,0.9);">
            <i class="fa-solid fa-trophy" style="font-size:60px; color:#ffd700; margin-bottom:15px;"></i>
            <h1 id="winner-title" style="color:var(--epl-green); margin-bottom:10px;">ARSENAL WINS!</h1>
            <p id="winner-score" style="font-size:18px; margin-bottom:15px;"></p>
            <p id="winner-prize" style="font-size:22px; color:#ffd700; font-weight:bold; margin-bottom:20px;"></p>
            <button class="btn-action" onclick="resetToSelection()">ድጋሚ ጫወት</button>
        </div>

    </div>

    <script>
        let balance = 500;
        let currentBet = 10;
        
        const eplTeams = [
            { id: 'ARS', name: 'Arsenal', color: '#ef0107' },
            { id: 'MCI', name: 'Man City', color: '#6cabdd' },
            { id: 'LIV', name: 'Liverpool', color: '#c8102e' },
            { id: 'MUN', name: 'Man United', color: '#da020e' },
            { id: 'CHE', name: 'Chelsea', color: '#034694' },
            { id: 'TOT', name: 'Tottenham', color: '#132257' }
        ];

        let selectedP1 = eplTeams[0];
        let selectedP2 = eplTeams[1];

        let currentRound = 1;
        let currentTurn = 1; // 1 = P1, 2 = P2
        let p1Score = 0;
        let p2Score = 0;
        let isShooting = false;

        // AUTH FUNCTIONS
        function sendOTP() {
            const phone = document.getElementById('user-phone').value;
            if (phone.length >= 10) {
                alert(`OTP ቁጥር በ SMS ወደ ${phone} ተልኳል! (ለሙከራ: 1234)`);
                document.getElementById('otp-group').style.display = 'block';
            } else {
                alert('እባክዎን ትክክለኛ የስልክ ቁጥር ያስገቡ!');
            }
        }

        function verifyOTP() {
            const otp = document.getElementById('otp-code').value;
            if (otp === "1234") {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('select-screen').classList.remove('hidden');
                updateBalanceUI();
            } else {
                alert('የተሳሳተ OTP ቁጥር!');
            }
        }

        function updateBalanceUI() {
            document.getElementById('user-balance').innerText = balance;
        }

        // TEAMS SETUP
        function renderTeams() {
            const p1Grid = document.getElementById('p1-teams');
            const p2Grid = document.getElementById('p2-teams');
            p1Grid.innerHTML = ''; p2Grid.innerHTML = '';

            eplTeams.forEach(t => {
                const c1 = document.createElement('div');
                c1.className = `team-card ${t.id === selectedP1.id ? 'selected' : ''}`;
                c1.innerText = t.name;
                c1.onclick = () => { selectedP1 = t; renderTeams(); };
                p1Grid.appendChild(c1);

                const c2 = document.createElement('div');
                c2.className = `team-card ${t.id === selectedP2.id ? 'selected' : ''}`;
                c2.innerText = t.name;
                c2.onclick = () => { selectedP2 = t; renderTeams(); };
                p2Grid.appendChild(c2);
            });
        }
        renderTeams();

        function startMatch() {
            currentBet = parseFloat(document.getElementById('bet-amount').value);
            if (balance < currentBet) {
                alert('በቂ ባላንስ የሎትም!');
                return;
            }

            balance -= currentBet;
            updateBalanceUI();

            document.getElementById('select-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');

            document.getElementById('p1-hud-name').innerText = selectedP1.name;
            document.getElementById('p2-hud-name').innerText = selectedP2.name;
            
            p1Score = 0; p2Score = 0; currentRound = 1; currentTurn = 1;
            updateScoreUI();
        }

        function updateScoreUI() {
            document.getElementById('score-text').innerText = `${p1Score} - ${p2Score}`;
            document.getElementById('round-text').innerText = `ዙር ${currentRound} / 6`;
        }

        function takeShot(zone) {
            if (isShooting) return;
            isShooting = true;

            const ball = document.getElementById('football');
            const keeper = document.getElementById('goalkeeper');

            // Ball animation
            ball.style.bottom = '220px';
            ball.style.transform = 'scale(0.5)';

            // Keeper save decision (40% save rate)
            const isSaved = Math.random() < 0.4;
            if (isSaved) {
                keeper.style.transform = 'translateX(-100px) rotate(-30deg)';
            } else {
                keeper.style.transform = 'translateX(100px) rotate(30deg)';
            }

            setTimeout(() => {
                if (!isSaved) {
                    if (currentTurn === 1) p1Score++;
                    else p2Score++;
                    document.getElementById('commentary-text').innerText = "ጎኦኦኦል! ድንቅ ምት!";
                } else {
                    document.getElementById('commentary-text').innerText = "ተመለሰ! በረኛው አደነው!";
                }

                updateScoreUI();

                // Next turn
                setTimeout(() => {
                    ball.style.bottom = '40px';
                    ball.style.transform = 'scale(1)';
                    keeper.style.transform = 'none';

                    if (currentTurn === 1) {
                        currentTurn = 2;
                    } else {
                        currentTurn = 1;
                        currentRound++;
                    }

                    if (currentRound > 6) {
                        endGame();
                    } else {
                        isShooting = false;
                    }
                }, 1200);

            }, 600);
        }

        function endGame() {
            document.getElementById('winner-screen').classList.remove('hidden');
            const winnerText = document.getElementById('winner-title');
            const scoreText = document.getElementById('winner-score');
            const prizeText = document.getElementById('winner-prize');

            scoreText.innerText = `ውጤት: ${selectedP1.name} ${p1Score} - ${p2Score} ${selectedP2.name}`;

            if (p1Score > p2Score) {
                const winAmt = currentBet * 1.5;
                balance += winAmt;
                winnerText.innerText = `እንኳን ደስ አለዎት! ${selectedP1.name} አሸነፈ!`;
                prizeText.innerText = `የተሸለሙት የብር መጠን: +${winAmt} ብር`;
            } else if (p2Score > p1Score) {
                winnerText.innerText = `${selectedP2.name} አሸነፈ!`;
                prizeText.innerText = `የተጫወቱት ${currentBet} ብር ተበልቷል።`;
            } else {
                balance += currentBet; // Draw refund
                winnerText.innerText = "አኩል ወጡ!";
                prizeText.innerText = `የተጫወቱት ${currentBet} ብር ተመልሶልዎታል።`;
            }
            updateBalanceUI();
        }

        function resetToSelection() {
            isShooting = false;
            document.getElementById('winner-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('select-screen').classList.remove('hidden');
        }
    </script>
</body>
</html>
