<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ዕድል በስክራች - Multi-Language Scratch Game</title>
    <style>
        :root {
            --primary: #9b51e0;
            --accent: #ff007f;
            --gold: #ffd700;
            --bg: #0d001a;
            --card-bg: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: radial-gradient(circle, #2c004d 0%, var(--bg) 100%);
            color: #fff;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 25px;
            padding: 20px;
            box-shadow: 0 0 35px rgba(255, 0, 127, 0.4);
            text-align: center;
        }

        .lang-picker {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-bottom: 15px;
        }

        .lang-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--gold);
            color: #fff;
            padding: 5px 8px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            width: auto;
        }

        .lang-btn.active-lang {
            background: var(--gold);
            color: #000;
            font-weight: bold;
        }

        h1, h2 {
            color: var(--gold);
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
            margin: 10px 0;
        }

        .screen { display: none; }
        .active { display: block; }

        input, select, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 12px;
            border: none;
            outline: none;
            font-size: 15px;
            box-sizing: border-box;
        }

        input { background: rgba(255, 255, 255, 0.95); color: #000; }

        button {
            background: linear-gradient(45deg, var(--accent), var(--primary));
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.3);
            transition: 0.2s;
        }

        button:hover { transform: scale(1.02); }

        .balance-card {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            padding: 15px;
            border-radius: 15px;
            font-size: 22px;
            font-weight: bold;
            color: #000;
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(56, 239, 125, 0.4);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 15px 0;
        }

        .card-cell {
            width: 100%;
            height: 75px;
            background: #1a1a2e;
            border-radius: 12px;
            font-size: 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            user-select: none;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .cover {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--gold), #ff8c00);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: #000;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .cover.scratched {
            opacity: 0;
            pointer-events: none;
        }

        .nav-menu {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .nav-menu button {
            padding: 8px;
            font-size: 13px;
        }

        .status-msg {
            font-weight: bold;
            color: var(--gold);
            min-height: 25px;
            margin: 10px 0;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Language Selector -->
    <div class="lang-picker">
        <button class="lang-btn active-lang" onclick="setLanguage('am')">አማርኛ</button>
        <button class="lang-btn" onclick="setLanguage('en')">English</button>
        <button class="lang-btn" onclick="setLanguage('om')">Oromoo</button>
        <button class="lang-btn" onclick="setLanguage('ti')">ትግርኛ</button>
        <button class="lang-btn" onclick="setLanguage('aa')">Qafar</button>
    </div>

    <!-- 1. AUTH SCREEN -->
    <div id="auth-screen" class="screen active">
        <h1 id="txt-title">ዕድል በስክራች</h1>
        <p id="txt-enter-phone">ለመጀመር የስልክ ቁጥርዎን ያስገቡ</p>
        <input type="tel" id="phone" placeholder="09........">
        <button onclick="sendOTP()" id="btn-send-otp">OTP አስገባ</button>

        <div id="otp-section" style="display:none; margin-top:15px;">
            <input type="number" id="otp" placeholder="የ4 አሃዝ OTP ያስገቡ">
            <button onclick="verifyOTP()" id="btn-verify">ተመዝገብ / ግባ</button>
        </div>
    </div>

    <!-- 2. MAIN GAME SCREEN -->
    <div id="game-screen" class="screen">
        <div class="balance-card">
            <span id="lbl-balance">ቀሪ ሂሳብ</span>: <span id="user-balance">0</span> ETB
        </div>

        <div class="nav-menu">
            <button onclick="showDepositScreen()" style="background:#28a745;" id="btn-dep-menu">+ ብር አስገባ</button>
            <button onclick="showWithdrawScreen()" style="background:#dc3545;" id="btn-with-menu">- ብር ወጪ አድርግ</button>
        </div>

        <label id="lbl-select-bet" style="font-size:14px;">የመጫወቻ ብር ይምረጡ፦</label>
        <select id="bet-amount">
            <option value="10">10 ETB</option>
            <option value="20">20 ETB</option>
            <option value="30">30 ETB</option>
            <option value="40">40 ETB</option>
            <option value="50">50 ETB</option>
            <option value="60">60 ETB</option>
            <option value="70">70 ETB</option>
            <option value="80">80 ETB</option>
            <option value="90">90 ETB</option>
            <option value="100">100 ETB</option>
        </select>

        <button onclick="startNewGame()" id="btn-start">ጌሙን ጀምር (ፍቅ)</button>

        <div class="status-msg" id="game-status"></div>

        <!-- 12 Cards Grid -->
        <div class="grid-container" id="grid"></div>
    </div>

    <!-- 3. DEPOSIT SCREEN (Telebirr Auto) -->
    <div id="deposit-screen" class="screen">
        <h2 id="txt-dep-title">በቴሌብር ብር ማስገቢያ</h2>
        <p style="font-size:12px; text-align:left;">*127# ደውለው ወደ <b>0913339553</b> ብር ያስተላልፉ። የደረሰዎትን ትራንዛክሽን ቁጥር ያስገቡ።</p>
        <input type="number" id="deposit-amount" placeholder="የብር መጠን">
        <input type="text" id="tx-id" placeholder="የቴሌብር Trans. ID / SMS Password">
        <button onclick="processDeposit()" id="btn-confirm-dep">አውቶሜሽን አረጋግጥ</button>
        <button onclick="showGameScreen()" style="background:#555;" id="btn-back1">ተመለስ</button>
    </div>

    <!-- 4. WITHDRAW SCREEN -->
    <div id="withdraw-screen" class="screen">
        <h2 id="txt-with-title">ብር ወጪ ማድረጊያ (Telebirr)</h2>
        <p style="font-size:12px; color:#ff8c00;" id="txt-with-rule">ማሳሰቢያ፡ ወጪ ማድረግ የሚቻለው ቢያንስ 1,000 ብር ሲጠራቀም ብቻ ነው።</p>
        <input type="number" id="withdraw-amount" placeholder="የሚወጣው ብር መጠን">
        <input type="tel" id="withdraw-phone" placeholder="የቴሌብር ስልክ ቁጥር">
        <button onclick="processWithdrawal()" id="btn-confirm-with">ወደ ቴሌብር ላክ</button>
        <button onclick="showGameScreen()" style="background:#555;" id="btn-back2">ተመለስ</button>
    </div>

</div>

<script>
    // System State
    let balance = 0;
    let currentBet = 10;
    let gridSymbols = [];
    let scratchedCount = 0;
    let isGameActive = false;
    let playedGamesCount = 0; // Win algorithm counter
    let currentLang = 'am';

    const symbols = ['🍎', '💎', '🥚', '🍋'];

    // Multi-language Text Dictionary
    const translations = {
        am: {
            title: "ዕድል በስክራች", enterPhone: "ለመጀመር የስልክ ቁጥርዎን ያስገቡ", sendOtp: "OTP አስገባ", verify: "ተመዝገብ / ግባ",
            balance: "ቀሪ ሂሳብ", deposit: "+ ብር አስገባ", withdraw: "- ብር ወጪ አድርግ", selectBet: "የመጫወቻ ብር ይምረጡ፦",
            start: "ጌሙን ጀምር (ፍቅ)", win: "🎉 እንኳን ደስ አለዎት! አሸንፈዋል!", lose: "❌ አላሸነፉም! ደግመው ይሞክሩ።",
            scratchPrompt: "12ቱን ሳጥኖች ይፍቁ!", depTitle: "በቴሌብር ብር ማስገቢያ", withTitle: "ብር ወጪ ማድረጊያ (Telebirr)",
            withRule: "ማሳሰቢያ፡ ወጪ ማድረግ የሚቻለው ቢያንስ 1,000 ብር ሲጠራቀም ብቻ ነው።", confirmDep: "አውቶሜሽን አረጋግጥ",
            confirmWith: "ወደ ቴሌብር ላክ", back: "ተመለስ"
        },
        en: {
            title: "Scratch & Win", enterPhone: "Enter Phone Number to Start", sendOtp: "Send OTP", verify: "Register / Login",
            balance: "Balance", deposit: "+ Deposit", withdraw: "- Withdraw", selectBet: "Select Bet Amount:",
            start: "Start Game (Scratch)", win: "🎉 Congratulations! You Won!", lose: "❌ You Lost! Try Again.",
            scratchPrompt: "Scratch all 12 cards!", depTitle: "Telebirr Deposit", withTitle: "Telebirr Withdrawal",
            withRule: "Notice: Minimum withdrawal threshold is 1,000 ETB.", confirmDep: "Verify Automation",
            confirmWith: "Send to Telebirr", back: "Back"
        },
        om: {
            title: "Carraa Scratch", enterPhone: "Eegaluuf Lakkoofsa Bilbilaa Galchaa", sendOtp: "OTP Ergi", verify: "Galmaa'i / Seeni",
            balance: "Haftee Qabduu", deposit: "+ Qarshii Galchi", withdraw: "- Qarshii Baasi", selectBet: "Qarshii Taphaa Filadhaa:",
            start: "Tapha Jalqabi", win: "🎉 Baga Gamaddan! Mootaniል!", lose: "❌ Hin Moonye! Irra Deebi'i.",
            scratchPrompt: "Saanduqa 12an harcaasaa!", depTitle: "Telebirr dhaan Galchuu", withTitle: "Telebirr dhaan Baasuu",
            withRule: "Hubachiisa: Qarshii 1,000 ol qofa baasuun ni danda'ama.", confirmDep: "Mirkaneessi",
            confirmWith: "Telebirr tiitti Ergi", back: "Deebi'i"
        },
        ti: {
            title: "ዕድል ብስክራች", enterPhone: "ክትጅምሩ ቁፅሪ ስልካችሁ ኣእትዉ", sendOtp: "OTP ስደድ", verify: "ተመዝገብ / እተው",
            balance: "ዝተረፈ ባላንስ", deposit: "+ ብር ኣእቱ", withdraw: "- ብር ወፅኢ ግበር", selectBet: "መጫወቲ ብር ሕረዩ፦",
            start: "ጌም ጀምር", win: "🎉 እንቋዕ ደስበለኩም! ኣሸኒፍኩም!", lose: "❌ ኣየሸነፍኩምን! ድግምኩም ሞክሩ።",
            scratchPrompt: "12 ሣጥናት ፍቁ!", depTitle: "ብቴሌብር ብር ምእታው", withTitle: "ብር ወፅኢ ምግባር (Telebirr)",
            withRule: "ማዕረዶ፡ ወፅኢ ምግባር ዝከኣል እንተወሓደ 1,000 ብር እንተተኣኪቡ ጥራሕ እዩ።", confirmDep: "ኦቶሜሽን ኣረጋግፅ",
            confirmWith: "ናብ ቴሌብር ስደድ", back: "ተመለስ"
        },
        aa: {
            title: "Scratch Gafagaf", enterPhone: "Qimbisaah Telefon Numba Haa", sendOtp: "OTP Ruuba", verify: "Caguta / Cula",
            balance: "Bakiya", deposit: "+ Lakqoo Cula", withdraw: "- Lakqoo Yewqe", selectBet: "Gafagaf Lakqoo Doora:",
            start: "Qimbiya", win: "🎉 Yaarak le! Yaffere!", lose: "❌ Mayaffinnim! Qaduun xagti.",
            scratchPrompt: "12 Sanduuqa Fakka!", depTitle: "Telebirr Cula", withTitle: "Telebirr Yewqe",
            withRule: "Asoobak: Minimum withdraw 1,000 ETB kinni.", confirmDep: "Automation Check",
            confirmWith: "Telebirr Fan Ruuba", back: "Gada"
        }
    };

    function setLanguage(lang) {
        currentLang = lang;
        document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active-lang'));
        event.target.classList.add('active-lang');

        const t = translations[lang];
        document.getElementById('txt-title').innerText = t.title;
        document.getElementById('txt-enter-phone').innerText = t.enterPhone;
        document.getElementById('btn-send-otp').innerText = t.sendOtp;
        document.getElementById('btn-verify').innerText = t.verify;
        document.getElementById('lbl-balance').innerText = t.balance;
        document.getElementById('btn-dep-menu').innerText = t.deposit;
        document.getElementById('btn-with-menu').innerText = t.withdraw;
        document.getElementById('lbl-select-bet').innerText = t.selectBet;
        document.getElementById('btn-start').innerText = t.start;
        document.getElementById('txt-dep-title').innerText = t.depTitle;
        document.getElementById('txt-with-title').innerText = t.withTitle;
        document.getElementById('txt-with-rule').innerText = t.withRule;
        document.getElementById('btn-confirm-dep').innerText = t.confirmDep;
        document.getElementById('btn-confirm-with').innerText = t.confirmWith;
        document.getElementById('btn-back1').innerText = t.back;
        document.getElementById('btn-back2').innerText = t.back;
        
        // Dynamic direction adjustment for languages if needed
        document.documentElement.lang = lang;
    }

    function sendOTP() {
        const phone = document.getElementById('phone').value;
        if(phone.length >= 10) {
            alert('OTP Code Sent via Telebirr Gateway to: ' + phone + '\n(Use Code: 1234)');
            document.getElementById('otp-section').style.display = 'block';
        } else {
            alert('Please enter valid Ethiopian Phone Number');
        }
    }

    function verifyOTP() {
        if(document.getElementById('otp').value === "1234") {
            document.getElementById('auth-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            updateBalance();
        } else {
            alert('Invalid OTP Code!');
        }
    }

    function showDepositScreen() {
        document.getElementById('game-screen').classList.remove('active');
        document.getElementById('deposit-screen').classList.add('active');
    }

    function showWithdrawScreen() {
        document.getElementById('game-screen').classList.remove('active');
        document.getElementById('withdraw-screen').classList.add('active');
    }

    function showGameScreen() {
        document.getElementById('deposit-screen').classList.remove('active');
        document.getElementById('withdraw-screen').classList.remove('active');
        document.getElementById('game-screen').classList.add('active');
    }

    // Auto Deposit Processing
    function processDeposit() {
        const amount = parseFloat(document.getElementById('deposit-amount').value);
        const txId = document.getElementById('tx-id').value;

        if(amount > 0 && txId.length > 3) {
            balance += amount;
            updateBalance();
            alert(`Telebirr Auto-Verification Successful!\nAdded ${amount} ETB to Balance.`);
            showGameScreen();
        } else {
            alert('Invalid Transaction Details!');
        }
    }

    // Withdrawal Rules Enforcement (1000 ETB Threshold)
    function processWithdrawal() {
        const amount = parseFloat(document.getElementById('withdraw-amount').value);
        const phone = document.getElementById('withdraw-phone').value;

        if(balance < 1000) {
            alert(`ለማውጣት አልተፈቀደም!\nያለዎት ባላንስ ${balance} ETB ነው። ዝቅተኛው የማውጫ መጠን 1,000 ETB ነው።`);
            return;
        }

        if(amount > balance) {
            alert('በቂ ባላንስ የሎትም!');
            return;
        }

        if(amount >= 1000 && phone.length >= 10) {
            balance -= amount;
            updateBalance();
            alert(`የ ${amount} ETB ክፍያ ጥያቄዎ በቴሌብር ወደ ${phone} ተልኳል!`);
            showGameScreen();
        } else {
            alert('እባክዎን ከ1,000 ETB በላይ መጠን ያስገቡ');
        }
    }

    function updateBalance() {
        document.getElementById('user-balance').innerText = balance;
    }

    function startNewGame() {
        currentBet = parseFloat(document.getElementById('bet-amount').value);

        if(balance < currentBet) {
            alert('በቂ ባላንስ የሎትም። እባክዎን በቴሌብር ብር ያስገቡ!');
            showDepositScreen();
            return;
        }

        balance -= currentBet;
        updateBalance();
        isGameActive = true;
        scratchedCount = 0;
        playedGamesCount++;
        document.getElementById('game-status').innerText = translations[currentLang].scratchPrompt;

        generate12Board();
    }

    // 12 Cards Logic with 1-in-4 Win Ratio Algorithm
    function generate12Board() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        gridSymbols = [];

        // 25% Win algorithm (Every 4th game guarantees a win condition pattern)
        let isWinningRound = (playedGamesCount % 4 === 0);
        let chosenSymbol = symbols[Math.floor(Math.random() * symbols.length)];

        if(isWinningRound) {
            // Force at least 3 matching symbols in a sequence
            gridSymbols = ['🍎', '💎', '🥚', '🍋', '🍎', '💎', '🥚', '🍋', '🍎', '💎', '🥚', '🍋'];
            gridSymbols[0] = chosenSymbol;
            gridSymbols[1] = chosenSymbol;
            gridSymbols[2] = chosenSymbol; // Row 1 Win
        } else {
            // Random mixed arrangement
            for (let i = 0; i < 12; i++) {
                gridSymbols.push(symbols[Math.floor(Math.random() * symbols.length)]);
            }
        }

        // Shuffle slightly for UI display
        for (let i = 0; i < 12; i++) {
            const cell = document.createElement('div');
            cell.className = 'card-cell';
            cell.innerText = gridSymbols[i];

            const cover = document.createElement('div');
            cover.className = 'cover';
            cover.innerText = '🍎';
            cover.onclick = () => scratchCard(cover);

            cell.appendChild(cover);
            grid.appendChild(cell);
        }
    }

    function scratchCard(coverElement) {
        if(!isGameActive || coverElement.classList.contains('scratched')) return;

        coverElement.classList.add('scratched');
        scratchedCount++;

        if (scratchedCount === 12) {
            checkWinCondition();
        }
    }

    function checkWinCondition() {
        isGameActive = false;
        let isWin = false;

        // Check horizontal 3-in-a-row matches across 12 grid cards
        for(let i = 0; i < 12; i += 3) {
            if(gridSymbols[i] === gridSymbols[i+1] && gridSymbols[i+1] === gridSymbols[i+2]) {
                isWin = true;
                break;
            }
        }

        if (isWin) {
            const winAmount = currentBet * 1.5;
            balance += winAmount;
            updateBalance();
            document.getElementById('game-status').innerText = `${translations[currentLang].win} (+${winAmount} ETB)`;
        } else {
            document.getElementById('game-status').innerText = translations[currentLang].lose;
        }
    }

    // Initialize Default State
    generate12Board();
</script>

</body>
</html>
