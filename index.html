<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ዕድል በስክራች - Scratch & Win Game</title>
    <style>
        :root {
            --primary: #8a2be2;
            --accent: #ff007f;
            --gold: #ffd700;
            --bg: #12002b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle, #2a085c 0%, var(--bg) 100%);
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.3);
            text-align: center;
        }

        h1, h2 {
            color: var(--gold);
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            margin-bottom: 15px;
        }

        .screen {
            display: none;
        }

        .active {
            display: block;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            border: none;
            outline: none;
            font-size: 16px;
            box-sizing: border-box;
        }

        input {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
        }

        button {
            background: linear-gradient(45deg, var(--accent), var(--primary));
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.02);
        }

        .balance-card {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            padding: 15px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px 0;
            position: relative;
        }

        .card-cell {
            width: 100%;
            height: 90px;
            background: #222;
            border-radius: 12px;
            font-size: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            user-select: none;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        .cover {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--gold), #ff8c00);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            font-weight: bold;
            color: #000;
            transition: opacity 0.4s ease;
        }

        .cover.scratched {
            opacity: 0;
            pointer-events: none;
        }

        .instructions {
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            text-align: left;
            margin: 10px 0;
        }

        .win-message {
            font-size: 18px;
            font-weight: bold;
            color: var(--gold);
            min-height: 25px;
            margin: 10px 0;
        }
    </style>
</head>
<body>

<div class="container">

    <div id="auth-screen" class="screen active">
        <h1>ዕድል በስክራች</h1>
        <p>ለመጀመር ስልክ ቁጥርዎን ያስገቡ</p>
        <input type="tel" id="phone" placeholder="09........">
        <button onclick="sendOTP()">OTP ላክ</button>

        <div id="otp-section" style="display:none; margin-top:20px;">
            <input type="number" id="otp" placeholder="የደረሰዎትን 4 አሃዝ OTP ያስገቡ">
            <button onclick="verifyOTP()">ተመዝገብ / ግባ</button>
        </div>
    </div>

    <div id="deposit-screen" class="screen">
        <h2>ሒሳብ ይሙሉ (Deposit)</h2>
        <div class="instructions">
            <b>ብር የመሙያ መመሪያ፦</b><br>
            1. በስልክዎ <b>*127#</b> ይደውሉ<br>
            2. ወደ ቴሌብር ቁጥር <b>0913339553</b> ብር ያስተላልፉ<br>
            3. ከቴሌብር የደረሰዎትን የትራንዛክሽን ቁጥር/ሜሴጅ ፓስወርድ ከታች ያስገቡ።
        </div>
        <input type="number" id="deposit-amount" placeholder="የብር መጠን (10, 20, 50...)" min="10">
        <input type="text" id="tx-id" placeholder="የቴሌብር ትራንዛክሽን ID / ፓስወርድ">
        <button onclick="processDeposit()">ብር ወደ ቆጥ አስገባ</button>
        <button onclick="showGameScreen()" style="background: #555;">ወደ ጌም ሰሌዳ ተመለስ</button>
    </div>

    <div id="game-screen" class="screen">
        <div class="balance-card">
            ሒሳብዎ: <span id="user-balance">0</span> ብር
        </div>

        <button onclick="showDepositScreen()" style="background: #28a745; margin-bottom:15px;">+ ብር አስገባ (Telebirr)</button>

        <h3>ለመጫወት የብር መጠን ይምረጡ</h3>
        <select id="bet-amount">
            <option value="10">10 ብር (ለማሸነፍ: 15 ብር)</option>
            <option value="20">20 ብር (ለማሸነፍ: 30 ብር)</option>
            <option value="30">30 ብር (ለማሸነፍ: 45 ብር)</option>
            <option value="40">40 ብር (ለማሸነፍ: 60 ብር)</option>
            <option value="50">50 ብር (ለማሸነፍ: 75 ብር)</option>
            <option value="60">60 ብር (ለማሸነፍ: 90 ብር)</option>
            <option value="70">70 ብር (ለማሸነፍ: 105 ብር)</option>
            <option value="80">80 ብር (ለማሸነፍ: 120 ብር)</option>
            <option value="90">90 ብር (ለማሸነፍ: 135 ብር)</option>
            <option value="100">100 ብር (ለማሸነፍ: 150 ብር)</option>
        </select>

        <button onclick="startNewGame()" id="start-btn">ጌሙን ጀምር (ፍቅ)</button>

        <div class="win-message" id="game-status"></div>

        <div class="grid-container" id="grid">
            </div>
    </div>

</div>

<script>
    let balance = 0;
    let currentBet = 10;
    let gridSymbols = [];
    let scratchedCount = 0;
    let isGameActive = false;

    // Symbols for game
    const symbols = ['🍎', '💎', '🥚', '🍋'];

    function sendOTP() {
        const phone = document.getElementById('phone').value;
        if(phone.length >= 10) {
            alert('OTP ቁጥር በ SMS ወደ ' + phone + ' ተልኳል! (ለሙከራ: 1234 ያስገቡ)');
            document.getElementById('otp-section').style.display = 'block';
        } else {
            alert('እባክዎን ትክክለኛ የስልክ ቁጥር ያስገቡ');
        }
    }

    function verifyOTP() {
        const otp = document.getElementById('otp').value;
        if(otp === "1234" || otp.length === 4) {
            document.getElementById('auth-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            updateBalance();
        } else {
            alert('የተሳሳተ OTP! እባክዎን ደግመው ይሞክሩ።');
        }
    }

    function showDepositScreen() {
        document.getElementById('game-screen').classList.remove('active');
        document.getElementById('deposit-screen').classList.add('active');
    }

    function showGameScreen() {
        document.getElementById('deposit-screen').classList.remove('active');
        document.getElementById('game-screen').classList.add('active');
    }

    function processDeposit() {
        const amount = parseFloat(document.getElementById('deposit-amount').value);
        const txId = document.getElementById('tx-id').value;

        if(amount > 0 && txId.length > 3) {
            balance += amount;
            updateBalance();
            alert('የ ' + amount + ' ብር ክፍያዎ በተሳካ ሁኔታ ተረጋግጧል!');
            showGameScreen();
        } else {
            alert('እባክዎን ትክክለኛ የብር መጠን እና የትራንዛክሽን ፓስወርድ ያስገቡ');
        }
    }

    function updateBalance() {
        document.getElementById('user-balance').innerText = balance;
    }

    function startNewGame() {
        currentBet = parseFloat(document.getElementById('bet-amount').value);

        if(balance < currentBet) {
            alert('በቂ ባላንስ የሎትም። እባክዎን በቴሌብር ብር ያስገቡ!');
            showDepositScreen();
            return;
        }

        // Deduct Bet
        balance -= currentBet;
        updateBalance();
        isGameActive = true;
        scratchedCount = 0;
        document.getElementById('game-status').innerText = "ሳጥኖቹን ይፍቁ!";

        // Generate Board Items
        generateBoard();
    }

    function generateBoard() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        gridSymbols = [];

        // Randomize 6 symbols
        for (let i = 0; i < 6; i++) {
            const randomSymbol = symbols[Math.floor(Math.random() * symbols.length)];
            gridSymbols.push(randomSymbol);

            const cell = document.createElement('div');
            cell.className = 'card-cell';
            cell.innerText = randomSymbol;

            const cover = document.createElement('div');
            cover.className = 'cover';
            cover.innerText = '🍎'; // Default Apple icon cover
            cover.onclick = () => scratchCard(cover, i);

            cell.appendChild(cover);
            grid.appendChild(cell);
        }
    }

    function scratchCard(coverElement, index) {
        if(!isGameActive || coverElement.classList.contains('scratched')) return;

        coverElement.classList.add('scratched');
        scratchedCount++;

        if (scratchedCount === 6) {
            checkWinCondition();
        }
    }

    function checkWinCondition() {
        isGameActive = false;
        let isWin = false;

        // Check horizontal lines (Rows: [0,1,2] and [3,4,5])
        if (gridSymbols[0] === gridSymbols[1] && gridSymbols[1] === gridSymbols[2]) isWin = true;
        if (gridSymbols[3] === gridSymbols[4] && gridSymbols[4] === gridSymbols[5]) isWin = true;

        // Check vertical lines (Columns: [0,3], [1,4], [2,5] - 2 match) or diagonal rules
        if (gridSymbols[0] === gridSymbols[3] && gridSymbols[1] === gridSymbols[4] && gridSymbols[2] === gridSymbols[5]) isWin = true;

        if (isWin) {
            const winAmount = currentBet * 1.5;
            balance += winAmount;
            updateBalance();
            document.getElementById('game-status').innerText = `🎉 እንኳን ደስ አለዎት! ${winAmount} ብር አሸንፈዋል!`;
        } else {
            document.getElementById('game-status').innerText = "❌ አላሸነፉም! ደግመው ይሞክሩ።";
        }
    }

    // Init display
    generateBoard();
</script>

</body>
</html>
